<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estampador Cuántico - VentaniYA!</title>
    <style>
        :root {
            --quantum-glow: #00ffcc;
            --quantum-bg: #05050a;
            --quantum-text: #e0fbfc;
        }

        body {
            background-color: var(--quantum-bg);
            color: var(--quantum-text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 600px;
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid var(--quantum-glow);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        /* Sello Redondo Superior */
        .atomic-seal {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border: 2px dashed var(--quantum-glow);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5) inset;
            background: rgba(0, 255, 204, 0.05);
        }

        .atomic-seal h1 {
            font-size: 14px;
            margin: 0;
            color: var(--quantum-glow);
            text-shadow: 0 0 5px var(--quantum-glow);
        }

        .atomic-seal p {
            font-size: 8px;
            margin: 2px 0 0 0;
            letter-spacing: 0.5px;
        }

        /* Área del Lienzo / Imagen */
        .canvas-area {
            position: relative;
            width: 100%;
            height: 320px;
            background: #000;
            border: 1px solid #1a3a4b;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Letras Flotantes Atómicas sobre la imagen */
        .floating-atoms {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            pointer-events: none;
            font-size: 12px;
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc, 0 0 20px #0055ff;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 4px;
        }

        /* Línea de Tiempo e Info Inferior */
        .quantum-metadata {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--quantum-glow);
            text-align: left;
        }

        .timeline {
            font-size: 11px;
            color: #00ffcc;
            margin-bottom: 4px;
        }

        .hash-code {
            font-size: 9px;
            color: #8892b0;
            word-break: break-all;
        }

        /* Controles (Subir archivo y Botón Descargar) */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="file"] {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--quantum-glow);
            background: rgba(0,0,0,0.5);
            border: 1px dashed var(--quantum-glow);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .btn-stamp {
            background: transparent;
            color: var(--quantum-glow);
            border: 1px solid var(--quantum-glow);
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
            width: 100%;
        }

        .btn-stamp:hover {
            background: var(--quantum-glow);
            color: #000;
            box-shadow: 0 0 15px var(--quantum-glow);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sello Atómico Circular -->
        <div class="atomic-seal">
            <h1>VentaniYA!</h1>
            <p>La EstampiYA!</p>
            <p><strong>posta 1001</strong></p>
            <p style="font-size: 5px; margin-top: 4px;">DERECHOS RESERVADOS VERIFICACION CUANTICA</p>
        </div>

        <!-- Área de la Imagen / Papel a Estampar -->
        <div class="canvas-area">
            <img id="imagen-preview" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" alt="Papel o Foto Base">
            <div class="floating-atoms">⚡ LETRAS ATÓMICAS CUÁNTICAS ⚡</div>
        </div>

        <!-- Línea de Tiempo y Hash -->
        <div class="quantum-metadata">
            <div class="timeline" id="timeline-display">CARGANDO TIEMPO ATÓMICO...</div>
            <div class="hash-code" id="hash-display">HASH: GENERANDO BLOQUE...</div>
        </div>

        <!-- Controles para Cargar y Descargar -->
        <div class="controls">
            <input type="file" id="input-archivo" accept="image/*" onchange="cargarArchivo(event)">
            <button class="btn-stamp" onclick="descargarEstampado()">DESCARGAR ESTAMPADO CUÁNTICO</button>
        </div>
    </div>

    <script>
        function generarHashAleatorio() {
            const chars = "abcdef0123456789";
            let hash = "0x";
            for(let i = 0; i < 64; i++) {
                hash += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return hash;
        }

        function actualizarReloj() {
            const ahora = new Date();
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const anio = ahora.getFullYear();
            
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            const milisegundos = String(ahora.getMilliseconds()).padStart(3, '0');

            // Formato exacto solicitado: dia, mes año - hora.minutos.segundos.milisegundos
            const formatoTiempo = `${dia}/${mes}/${anio} - ${horas}.${minutos}.${segundos}.${milisegundos}`;
            
            document.getElementById('timeline-display').innerText = `🕒 ${formatoTiempo}`;
            document.getElementById('hash-display').innerText = `HASH: ${generarHashAleatorio()}`;
        }

        function cargarArchivo(event) {
            const archivo = event.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    document.getElementById('imagen-preview').src = e.target.result;
                }
                lector.readAsDataURL(archivo);
            }
        }

        function descargarEstampado() {
            actualizarReloj();
            
            // Creamos un lienzo invisible (canvas) para fusionar la foto, el sello y las leyendas
            const img = document.getElementById('imagen-preview');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 1000;
            canvas.height = 1000;

            // Fondo negro base
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar la imagen cargada
            let imgObj = new Image();
            imgObj.crossOrigin = "anonymous";
            imgObj.src = img.src;
            
            imgObj.onload = function() {
                ctx.drawImage(imgObj, 50, 200, 900, 600);

                // Sello Atómico Redondo Superior
                ctx.beginPath();
                ctx.arc(500, 100, 70, 0, 2 * Math.PI);
                ctx.fillStyle = "rgba(5, 5, 10, 0.85)";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#00ffcc";
                ctx.stroke();

                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 16px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("VentaniYA!", 500, 85);
                ctx.font = "11px 'Courier New'";
                ctx.fillText("La EstampiYA! posta 1001", 500, 105);
                ctx.font = "8px 'Courier New'";
                ctx.fillText("Derechos reservados - Verificación Cuántica", 500, 125);

                // Letras Atómicas Flotantes sobre la imagen
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 22px 'Courier New'";
                ctx.fillText("⚡ ESTAMPADO CUÁNTICO ATÓMICO ⚡", 500, 240);

                // Línea de tiempo y hash abajo
                const tiempoTexto = document.getElementById('timeline-display').innerText.replace('🕒 ', '');
                const hashTexto = document.getElementById('hash-display').innerText;

                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(50, 830, 900, 120);
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 2;
                ctx.strokeRect(50, 830, 900, 120);

                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 18px 'Courier New'";
                ctx.textAlign = "left";
                ctx.fillText("TIEMPO: " + tiempoTexto, 70, 875);
                
                ctx.fillStyle = "#8892b0";
                ctx.font = "14px 'Courier New'";
                ctx.fillText(hashTexto, 70, 915);

                // Descargar archivo generado automáticamente
                const enlaceDescarga = document.createElement('a');
                enlaceDescarga.download = 'estampado-cuantico-' + Date.now() + '.png';
                enlaceDescarga.href = canvas.toDataURL('image/png');
                enlaceDescarga.click();
            };
        }

        // Actualizar milisegundos en vivo
        setInterval(actualizarReloj, 50);
    </script>
</body>
</html>
