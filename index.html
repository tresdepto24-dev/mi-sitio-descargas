<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estampador Cuántico - VentaniYA!</title>
    <style>
        :root {
            --quantum-glow: #00ffcc;
            --quantum-bg: #05050a;
            --quantum-text: #e0fbfc;
        }

        body {
            background-color: var(--quantum-bg);
            color: var(--quantum-text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 600px;
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid var(--quantum-glow);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        /* Sello Redondo Superior */
        .atomic-seal {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border: 2px dashed var(--quantum-glow);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5) inset;
            animation: pulse-seal 3s infinite alternate;
            background: rgba(0, 255, 204, 0.05);
        }

        .atomic-seal h1 {
            font-size: 14px;
            margin: 0;
            color: var(--quantum-glow);
            text-shadow: 0 0 5px var(--quantum-glow);
        }

        .atomic-seal p {
            font-size: 8px;
            margin: 2px 0 0 0;
            letter-spacing: 0.5px;
        }

        /* Área de Estampado / Lienzo */
        .canvas-area {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
            border: 1px solid #1a3a4b;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-area img, .canvas-area video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        /* Letras Flotantes Atómicas */
        .floating-atoms {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            font-size: 13px;
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc, 0 0 20px #0055ff;
            opacity: 0.9;
            animation: float-effect 4s ease-in-out infinite alternate;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Línea de Tiempo e Info Inferior */
        .quantum-metadata {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--quantum-glow);
            text-align: left;
        }

        .timeline {
            font-size: 12px;
            color: #00ffcc;
            margin-bottom: 5px;
        }

        .hash-code {
            font-size: 10px;
            color: #8892b0;
            word-break: break-all;
        }

        /* Botón de Acción */
        .btn-stamp {
            margin-top: 15px;
            background: transparent;
            color: var(--quantum-glow);
            border: 1px solid var(--quantum-glow);
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
        }

        .btn-stamp:hover {
            background: var(--quantum-glow);
            color: #000;
            box-shadow: 0 0 15px var(--quantum-glow);
        }

        @keyframes pulse-seal {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(0, 255, 204, 0.3) inset; }
            100% { transform: scale(1.03); box-shadow: 0 0 18px rgba(0, 255, 204, 0.7) inset; }
        }

        @keyframes float-effect {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-5px) scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sello Atómico Circular -->
        <div class="atomic-seal">
            <h1>VentaniYA!</h1>
            <p>La EstampiYA!</p>
            <p><strong>posta 1001</strong></p>
            <p style="font-size: 6px; margin-top: 4px;">DERECHOS RESERVADOS</p>
        </div>

        <!-- Área de la Imagen con Letras Cuánticas Flotantes -->
        <div class="canvas-area">
            <!-- Aquí puedes cambiar la imagen por defecto -->
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" alt="Base Cuántica">
            <div class="floating-atoms">⚡ VERIFICACIÓN CUÁNTICA ACTIVA ⚡</div>
        </div>

        <!-- Línea de Tiempo y Hash -->
        <div class="quantum-metadata">
            <div class="timeline" id="timeline-display">CARGANDO TIEMPO ATÓMICO...</div>
            <div class="hash-code" id="hash-display">HASH: GENERANDO BLOQUE...</div>
        </div>

        <button class="btn-stamp" onclick="generarEstampadoCuantico()">EJECUTAR NUEVO ESTAMPADO</button>
    </div>

    <script>
        function generarHashAleatorio() {
            const chars = "abcdef0123456789";
            let hash = "0x";
            for(let i = 0; i < 64; i++) {
                hash += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return hash;
        }

        function actualizarEstampado() {
            const ahora = new Date();
            
            // Extracción de datos temporales exactos con milisegundos
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const anio = ahora.getFullYear();
            
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            const milisegundos = String(ahora.getMilliseconds()).padStart(3, '0');

            // Formato solicitado: dia, mes año - hora.minutos.segundos.milisegundos
            const formatoTiempo = `${dia}/${mes}/${anio} - ${horas}:${minutos}:${segundos}.${milisegundos}`;
            
            document.getElementById('timeline-display').innerText = `🕒 ${formatoTiempo}`;
            document.getElementById('hash-display').innerText = `HASH: ${generarHashAleatorio()}`;
        }

        function generarEstampadoCuantico() {
            actualizarEstampado();
            // Efecto visual rápido de destello al estampar
            const container = document.querySelector('.container');
            container.style.boxShadow = '0 0 35px #00ffcc';
            setTimeout(() => {
                container.style.boxShadow = '0 0 20px rgba(0, 255, 204, 0.3)';
            }, 300);
        }

        // Actualización en tiempo real de los milisegundos
        setInterval(actualizarEstampado, 50);
    </script>
</body>
</html>
